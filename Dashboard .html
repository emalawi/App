<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - EMALAWI19</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
body { font-family:'Roboto',sans-serif; background: linear-gradient(135deg,#6a11cb,#2575fc); color:#fff; display:flex; flex-direction:column; align-items:center; padding:30px; min-height:100vh; }
h1 { font-size:2.5em; margin-bottom:20px; }
form { background: rgba(255,255,255,0.95); color:#333; padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.3); width:500px; }
label { font-weight:bold; display:block; margin-top:15px; }
input, textarea, select { width:100%; padding:12px; margin-top:5px; border-radius:10px; border:1px solid #ccc; transition:.3s; }
input:focus, textarea:focus, select:focus { border-color:#6a11cb; box-shadow:0 0 10px rgba(106,17,203,0.5); }
button { margin-top:20px; padding:12px 25px; width:100%; background:#ff6a00; color:#fff; border:none; border-radius:50px; font-size:16px; cursor:pointer; transition:.3s; }
button:hover { background:#ff9e3c; transform:scale(1.05); }
#successMessage { text-align:center; color:green; font-weight:bold; margin-top:15px; display:none; }
#countdown { font-weight:bold; color:#ff6a00; }
.preview { margin-top:30px; background:#fff; color:#333; width:500px; padding:20px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center; }
.preview h3 { margin-bottom:10px; }
.preview img { width:80px; border-radius:15px; margin-bottom:10px; }
.gui { background:#eee; padding:10px; border-radius:15px; margin-top:10px; text-align:left; min-height:150px; }
.gui label { display:block; margin:5px 0; font-weight:normal; }
.gui input, .gui button { margin:5px 0; }
</style>
</head>
<body>
<h1>Dashboard - Interactive App Builder</h1>
<p id="successMessage">Form submitted! You will be redirected to the Thank You page in <span id="countdown">05:00</span> minutes.</p>

<form id="appForm" action="https://formspree.io/f/xlgdzzzd" method="POST" enctype="multipart/form-data" target="_blank">
<label>Your Email:</label>
<input type="email" name="_replyto" placeholder="Enter your email" id="email" required>
<label>App Name:</label>
<input type="text" name="app_name" placeholder="App Name" id="appName" required>
<label>App Description:</label>
<textarea name="description" rows="4" placeholder="Describe your app" id="appDesc" required></textarea>
<label>GUI Theme Color:</label>
<input type="color" name="theme_color" value="#6a11cb" id="appColor">
<label>Category:</label>
<select name="category" id="appCategory">
<option value="Utility">Utility</option>
<option value="Game">Game</option>
<option value="Education">Education</option>
<option value="Entertainment">Entertainment</option>
</select>
<label>Upload App Icon:</label>
<input type="file" name="icon" accept="image/*" id="appIcon">
<input type="hidden" name="_subject" value="New App Submission from EMALAWI19">
<button type="submit">Submit App</button>
</form>

<div class="preview" id="preview">
<h3 id="previewName">App Name</h3>
<img id="previewIcon" src="icon.png" alt="App Icon">
<p id="previewDesc">App description will appear here...</p>
<p>Category: <span id="previewCategory">Utility</span></p>
<p>Theme Color: <span id="previewColor">#6a11cb</span></p>
<div class="gui" id="guiPreview">
<label>Label Example</label>
<input placeholder="Text Input">
<button>Button</button>
</div>
</div>

<script>
const form=document.getElementById('appForm');
const message=document.getElementById('successMessage');
const countdownEl=document.getElementById('countdown');
let timer;
form.addEventListener('submit', function(){
  message.style.display='block';
  let time=300;
  timer=setInterval(()=>{
    let minutes=Math.floor(time/60);
    let seconds=time%60;
    countdownEl.textContent=`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    time--;
    if(time<0){ clearInterval(timer); window.location.href='thankyou.html'; }
  },1000);
});

// Live Preview
const appName=document.getElementById('appName');
const appDesc=document.getElementById('appDesc');
const appColor=document.getElementById('appColor');
const appCategory=document.getElementById('appCategory');
const appIcon=document.getElementById('appIcon');
const previewName=document.getElementById('previewName');
const previewDesc=document.getElementById('previewDesc');
const previewColor=document.getElementById('previewColor');
const previewCategory=document.getElementById('previewCategory');
const previewIcon=document.getElementById('previewIcon');
const guiPreview=document.getElementById('guiPreview');

appName.addEventListener('input',()=>previewName.textContent=appName.value||'App Name');
appDesc.addEventListener('input',()=>previewDesc.textContent=appDesc.value||'App description will appear here...');
appColor.addEventListener('input',()=>{
  previewColor.textContent=appColor.value;
  previewName.style.color=appColor.value;
  guiPreview.style.background=appColor.value+'22'; // light transparency
});
appCategory.addEventListener('change',()=>{
  previewCategory.textContent=appCategory.value;
  if(appCategory.value==='Game'){ guiPreview.style.border='3px dashed red'; }
  else{ guiPreview.style.border='1px solid #ccc'; }
});
appIcon.addEventListener('change',()=>{ const file=appIcon.files[0]; if(file){ previewIcon.src=URL.createObjectURL(file); } });
</script>
</body>
</html>
