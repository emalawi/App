<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You - EMALAWI19</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
body { font-family:'Roboto',sans-serif; background: linear-gradient(135deg,#ff6a00,#2575fc); color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; text-align:center; overflow:hidden; }
.container { background: rgba(255,255,255,0.95); color:#333; padding:50px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.3); animation:fadeIn 1s; }
h1 { font-size:2.5em; color:#2575fc; animation:bounce 2s infinite; }
p { margin-top:20px; font-size:1.2em; }
a { display:inline-block; margin-top:25px; padding:12px 25px; background:#ff6a00; color:#fff; border-radius:50px; text-decoration:none; transition:.3s; }
a:hover { background:#ff9e3c; transform:scale(1.05); }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
@keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
</style>
</head>
<body>
<div class="container">
<h1>Thank You!</h1>
<p>Your app submission has been received. Redirecting to Home in <span id="countdown">20</span> seconds.</p>
<a href="index.html">Go to Home Now</a>
</div>
<script>
let time=20;
const countdown=document.getElementById('countdown');
const interval=setInterval(()=>{
  countdown.textContent=time;
  time--;
  if(time<0){ clearInterval(interval); window.location.href='index.html'; }
},1000);
</script>
</body>
</html>
