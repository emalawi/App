<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login / Register - EMALAWI19</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
body { margin:0; padding:0; font-family:'Roboto',sans-serif; background: linear-gradient(120deg,#ff6a00,#2575fc); display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background: rgba(255,255,255,0.95); padding:40px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2); width:400px; text-align:center; }
.tab { cursor:pointer; display:inline-block; padding:10px 30px; border-radius:50px 50px 0 0; margin:0 2px; font-weight:bold; background:#eee; transition:0.3s; }
.tab.active { background:#2575fc; color:#fff; }
form { display:none; margin-top:20px; animation: fadeIn 1s; }
form.active { display:block; }
input { width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc; transition:.3s; }
input:focus { border-color:#2575fc; box-shadow:0 0 10px rgba(37,117,252,0.5); }
button { padding:12px 25px; margin-top:15px; width:100%; background:#ff6a00; color:#fff; border:none; border-radius:50px; cursor:pointer; font-size:16px; transition:.3s; }
button:hover { background:#ff9e3c; transform:scale(1.05); }
@keyframes fadeIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div class="container">
<h2>Welcome to EMALAWI19</h2>
<div>
<span class="tab active" onclick="showTab('login')">Login</span>
<span class="tab" onclick="showTab('register')">Register</span>
</div>
<form id="loginForm" class="active" onsubmit="location.href='dashboard.html'; return false;">
<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<form id="registerForm" onsubmit="location.href='dashboard.html'; return false;">
<input type="text" placeholder="Username" required>
<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>
<button type="submit">Register</button>
</form>
</div>
<script>
function showTab(tab){
document.getElementById('loginForm').classList.remove('active');
document.getElementById('registerForm').classList.remove('active');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(tab==='login'){ document.getElementById('loginForm').classList.add('active'); document.querySelectorAll('.tab')[0].classList.add('active'); }
else{ document.getElementById('registerForm').classList.add('active'); document.querySelectorAll('.tab')[1].classList.add('active'); }
}
</script>
</body>
</html>
