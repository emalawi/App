<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMALAWI19 App Development</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

body {
    margin:0; padding:0; font-family:'Roboto', sans-serif;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; overflow:hidden;
}

/* Heading & buttons */
h1 { font-size:3em; margin:20px 0; animation: fadeInDown 1.5s; text-align:center; }
p { font-size:1.2em; max-width:600px; animation: fadeInUp 1.5s; text-align:center; }
.btn {
    margin-top:30px; padding:15px 35px; font-size:18px; color:#fff;
    background:#ff6a00; border:none; border-radius:50px; cursor:pointer; transition:.4s; animation: fadeIn 2s; text-decoration:none;
}
.btn:hover { background:#ff9e3c; transform:scale(1.05); }

/* Logo carousel container */
#logo-carousel {
    position: relative; width:300px; height:300px; margin-bottom:40px;
    perspective: 1000px;
}
#logo-carousel img {
    width:80px; height:80px; position:absolute; top:50%; left:50%;
    transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
    opacity:0; transition: transform 0.5s ease, opacity 0.5s ease;
    border-radius:10px; background:#fff; cursor:pointer;
}

/* Tooltip for platform name */
#logo-carousel img[data-name]:hover::after {
    content: attr(data-name);
    position: absolute; bottom:110%; left:50%;
    transform: translateX(-50%);
    background: #ff6a00; color: #fff;
    padding: 5px 10px; border-radius:10px;
    white-space: nowrap; font-size:0.9em; font-weight:bold;
    opacity:1; pointer-events:none;
}

/* Particle canvas */
#particle-canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; }

/* Animations */
@keyframes fadeInDown { from {opacity:0; transform:translateY(-50px);} to {opacity:1; transform:translateY(0);} }
@keyframes fadeInUp { from {opacity:0; transform:translateY(50px);} to {opacity:1; transform:translateY(0);} }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div id="logo-carousel">
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg" data-name="Android" alt="Android Logo">
    <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" data-name="Java" alt="Java Logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Windows_logo_-_2021.svg" data-name="Windows" alt="Windows Logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" data-name="iOS" alt="iOS Logo">
</div>

<h1>Welcome to EMALAWI19</h1>
<p>Create Java Apps with EMALAWI19. Interactive GUIs, colorful themes, live preview, and more — all in one place!</p>
<a href="auth.html" class="btn">Get Started</a>

<script>
// Carousel logos
const carousel = document.getElementById('logo-carousel');
const logos = carousel.querySelectorAll('img');
const radius = 120;
const total = logos.length;
const centerX = 150, centerY = 150;
let rotateAngle = 0;
let mouseX = 0, mouseY = 0;

document.addEventListener('mousemove', e => {
    mouseX = (e.clientX - window.innerWidth/2)/50;
    mouseY = (e.clientY - window.innerHeight/2)/50;
});

function animateCarousel() {
    rotateAngle += 0.01;
    logos.forEach((logo, i) => {
        const theta = (i / total) * 2 * Math.PI + rotateAngle;
        const x = centerX + radius * Math.cos(theta);
        const y = centerY + radius * Math.sin(theta);
        logo.style.left = `${x}px`;
        logo.style.top = `${y}px`;
        logo.style.opacity = 1;
        logo.style.transform = `translate(-50%, -50%) scale(1) rotate(${rotateAngle*360}deg) rotateX(${mouseY}deg) rotateY(${mouseX}deg)`;
    });
    requestAnimationFrame(animateCarousel);
}
animateCarousel();

// Particle background
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
for(let i=0;i<100;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2+1,
        dx: (Math.random()-0.5)*0.5,
        dy: (Math.random()-0.5)*0.5
    });
}

function drawParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });
    requestAnimationFrame(drawParticles);
}
drawParticles();

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
